services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pcm_moyudan
      POSTGRES_USER: pcm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcm_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcm_user -d pcm_moyudan"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "True"
      SECRET_KEY: "docker-local-only-change-this-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      DATABASE_URL: "postgresql://pcm_user:${POSTGRES_PASSWORD:-pcm_local_password}@db:5432/pcm_moyudan"
      SERVE_MEDIA: "True"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
