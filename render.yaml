services:
  - type: web
    name: pcm-moyudan
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: pcm-moyudan.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pcm-moyudan.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SERVE_MEDIA
        value: "False"
