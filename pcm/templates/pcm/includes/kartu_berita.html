<article class="card">
  {% if berita.gambar_sampul %}<img src="{{ berita.gambar_sampul.url }}" alt="" loading="lazy">{% endif %}
  <div class="card-body">
    <time datetime="{{ berita.tanggal_terbit|date:'Y-m-d' }}">{{ berita.tanggal_terbit|date:"j F Y" }}</time>
    <h3><a href="{% url 'pcm:berita_detail' slug=berita.slug %}">{{ berita.judul }}</a></h3>
    <p>{{ berita.ringkasan }}</p>
  </div>
</article>
